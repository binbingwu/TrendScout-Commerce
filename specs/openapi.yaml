openapi: 3.1.0
info:
  title: TrendScout Commerce API
  version: 0.1.0
  description: >
    API contract for regional hot product rankings, source signals, and
    AI-ready market reports.
servers:
  - url: https://api.trendscout-commerce.local/v1
paths:
  /rankings:
    get:
      summary: Get ranked hot products by region and time window.
      operationId: getRankings
      parameters:
        - name: region
          in: query
          required: true
          schema:
            type: string
            example: US
        - name: window
          in: query
          required: true
          schema:
            type: string
            enum: [month, year]
        - name: top_n
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Ranked products.
          content:
            application/json:
              schema:
                type: object
                required: [region, window, products]
                properties:
                  region:
                    type: string
                  window:
                    type: string
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/RankedProduct"
  /products/{product_id}:
    get:
      summary: Get normalized product profile with multi-source signals.
      operationId: getProduct
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCandidate"
        "404":
          description: Product not found.
  /products/{product_id}/report:
    get:
      summary: Get AI generated market and outlook report.
      operationId: getProductReport
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [markdown, json]
            default: markdown
      responses:
        "200":
          description: Product report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductReport"
            text/markdown:
              schema:
                type: string
  /etl/runs:
    post:
      summary: Start an ETL run.
      operationId: createEtlRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, window]
              properties:
                region:
                  type: string
                  example: US
                window:
                  type: string
                  enum: [month, year]
                top_n:
                  type: integer
                  minimum: 1
                  maximum: 500
      responses:
        "202":
          description: ETL run accepted.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                    enum: [queued, running, completed, failed]
components:
  schemas:
    RankedProduct:
      type: object
      required: [rank, product_id, name, category, region, score]
      properties:
        rank:
          type: integer
        product_id:
          type: string
        name:
          type: string
        category:
          type: string
        region:
          type: string
        score:
          type: number
    ProductCandidate:
      type: object
      required: [product_id, name, category, region, signals]
      properties:
        product_id:
          type: string
        name:
          type: string
        brand:
          type: [string, "null"]
        category:
          type: string
        region:
          type: string
        source_urls:
          type: array
          items:
            type: string
            format: uri
        score:
          type: number
        signals:
          $ref: "#/components/schemas/ProductSignals"
    ProductSignals:
      type: object
      required:
        - commerce_rank
        - search_interest
        - social_mentions
        - social_velocity
        - sentiment
        - regional_fit
        - recency
      properties:
        commerce_rank:
          type: [number, "null"]
        search_interest:
          type: number
        social_mentions:
          type: number
        social_velocity:
          type: number
        sentiment:
          type: number
          minimum: -1
          maximum: 1
        regional_fit:
          type: number
          minimum: 0
          maximum: 1
        recency:
          type: number
          minimum: 0
          maximum: 1
    ProductReport:
      type: object
      required:
        - product_id
        - market_snapshot
        - demand_drivers
        - audience
        - competition
        - risks
        - forecast
        - actions
      properties:
        product_id:
          type: string
        market_snapshot:
          type: string
        demand_drivers:
          type: array
          items:
            type: string
        audience:
          type: string
        competition:
          type: string
        risks:
          type: array
          items:
            type: string
        forecast:
          type: string
        actions:
          type: array
          items:
            type: string
